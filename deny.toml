# cargo-deny — licenças, vulnerabilidades, crates banidos e origem das dependências.
# Analisa os dois perfis distribuídos (o CI roda ambos):
#   cargo deny --all-features --target x86_64-pc-windows-msvc check   # Windows com webview
#   cargo deny --target x86_64-unknown-linux-gnu check                 # Linux headless
# NÃO usar `--all-features` sem alvo: puxa "Linux + webview" (GTK/glib), que o projeto não builda.

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"   # só falha se a dependência DIRETA estiver sem manutenção
unsound = "all"
ignore = []                  # toda exceção aqui precisa de ID RUSTSEC + motivo + prazo

[licenses]
version = 2
confidence-threshold = 0.93
# Permissivas, compatíveis com MIT OR Apache-2.0. MPL-2.0 é copyleft fraco por ARQUIVO: ok usar
# sem modificar (cssparser/selectors via wry). CDLA-Permissive-2.0: webpki-roots.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"   # wry/tao/windows trazem versões duplicadas; não é bloqueante
wildcards = "deny"
allow-wildcard-paths = true  # path deps internas do workspace (publish = false)
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
