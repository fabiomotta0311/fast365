[package]
name = "f365-auth"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
webview = ["dep:wry", "dep:tao"]

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
keyring-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
async-trait.workspace = true

# WebView nativa efêmera só para o pareamento/login (ver §2.1).
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
base64 = "0.23"              # engine escalar `general_purpose` explícito (SIMD da 0.23 não é usado)
zeroize = "1"                # zera segredos (RT/cookies) ao sair de escopo

# Store real só no Windows (Credential Manager). Fora dele não há store persistente de propósito:
# segredo não vai para VPS/CI (AGENTS.md). Ver vault.rs.
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
