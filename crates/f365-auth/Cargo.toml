[package]
name = "f365-auth"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
webview = ["dep:wry", "dep:tao"]

[dependencies]
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
keyring.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
async-trait.workspace = true

# WebView nativa efêmera só para o pareamento/login (ver §2.1).
wry = { version = "0.57", optional = true }
tao = { version = "0.30", optional = true }
base64 = "0.22"
jsonwebtoken = "9"           # inspeção (NÃO validação) de claims: exp, aud, tid
zeroize = "1"                # zera segredos (RT/cookies) ao sair de escopo

# Sem `windows-native` o keyring v3 cai num store EM MEMÓRIA e o RT some ao fim do processo.
# Fora do Windows fica o store em memória de propósito: segredo não vai para VPS/CI (AGENTS.md).
[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
