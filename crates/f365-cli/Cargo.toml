[package]
name = "f365-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "f365"
path = "src/main.rs"

[features]
# Liga a WebView (login/MFA). No Windows rode: `cargo run -p f365-cli --features webview`.
webview = ["f365-auth/webview"]

[dependencies]
async-trait.workspace = true
f365-auth  = { path = "../f365-auth" }
f365-teams = { path = "../f365-teams" }
f365-sync = { path = "../f365-sync" }
f365-storage = { path = "../f365-storage" }
f365-driver = { path = "../f365-driver" }
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[build-dependencies]
winresource = "0.1"
