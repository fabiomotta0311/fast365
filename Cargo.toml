[workspace]
resolver = "2"
members = ["crates/f365-auth", "crates/f365-teams", "crates/f365-sync", "crates/f365-cli"]
# storage/ui/outlook adicionados só nas respectivas fases (ver docs/ARQUITETURA.md)

[workspace.package]
edition = "2021"           # subir p/ 2024 quando estabilizar na toolchain de uso
license = "MIT OR Apache-2.0"
rust-version = "1.89"      # mínimo exigido pelo Cargo.lock; o job `msrv` do CI garante
publish = false

[workspace.dependencies]
tokio   = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
keyring    = "3"
anyhow     = "1"
thiserror  = "2"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url        = "2"
async-trait = "0.1"
